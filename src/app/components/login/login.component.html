<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <i class="fas fa-boxes"></i>
      </div>
      <h1>Asset Management System</h1>
      <p>Sign in to access your dashboard</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" novalidate>
      <!-- Error Alert -->
      <div *ngIf="error" class="alert alert-error" (click)="clearError()">
        <i class="fas fa-exclamation-circle"></i>
        <span>{{ error }}</span>
        <button type="button" class="close-btn" aria-label="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- Username Field -->
      <div class="form-group">
        <label for="username" class="form-label">
          <i class="fas fa-user"></i>
          Username
        </label>
        <input
          type="text"
          id="username"
          formControlName="username"
          class="form-control"
          [class.invalid]="submitted && f['username'].errors"
          placeholder="Enter your username"
          autocomplete="username"
        />
        <div *ngIf="submitted && f['username'].errors" class="field-error">
          <div *ngIf="f['username'].errors['required']">Username is required</div>
          <div *ngIf="f['username'].errors['minlength']">Username must be at least 3 characters</div>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">
          <i class="fas fa-lock"></i>
          Password
        </label>
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            class="form-control"
            [class.invalid]="submitted && f['password'].errors"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
        <div *ngIf="submitted && f['password'].errors" class="field-error">
          <div *ngIf="f['password'].errors['required']">Password is required</div>
          <div *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</div>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="login-btn"
        [disabled]="loading"
        [class.loading]="loading"
      >
        <span *ngIf="!loading">
          <i class="fas fa-sign-in-alt"></i>
          Sign In
        </span>
        <span *ngIf="loading" class="loading-content">
          <i class="fas fa-spinner fa-spin"></i>
          Signing In...
        </span>
      </button>
    </form>

    <div class="login-footer">
      <p>&copy; 2025 Asset Management System. All rights reserved.</p>
    </div>
  </div>
</div>
