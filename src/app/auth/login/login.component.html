<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="container mt-5">
  <div class="card p-4" style="max-width: 400px; margin: auto;">
    <h2 class="card-title text-center">Asset Management Login</h2>
    <div class="form-group mb-3">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        formControlName="username"
        class="form-control"
        [ngClass]="{'is-invalid': loginForm.get('username')?.touched && loginForm.get('username')?.invalid}"
        aria-describedby="usernameHelp"
      >
      <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="invalid-feedback">
        Username is required.
      </div>
    </div>
    <div class="form-group mb-3">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        class="form-control"
        [ngClass]="{'is-invalid': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}"
        aria-describedby="passwordHelp"
      >
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="invalid-feedback">
        Password is required.
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Login</button>
    <div *ngIf="errorMessage" class="alert alert-danger mt-3" role="alert">
      {{ errorMessage }}
    </div>
  </div>
</form>
