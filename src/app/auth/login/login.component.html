<!-- login.component.html -->
<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <h2>Asset Management System Login</h2>
    
    <div class="form-group">
      <label for="username">Username</label>
      <input 
        type="text" 
        id="username" 
        formControlName="username"
        placeholder="Enter username"
        [class.invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
      >
      <div *ngIf="loginForm.get('username')?.errors?.['required'] && loginForm.get('username')?.touched" 
           class="error-message">
        Username is required
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input 
        type="password" 
        id="password" 
        formControlName="password"
        placeholder="Enter password"
        [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
      >
      <div *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched" 
           class="error-message">
        Password is required
      </div>
    </div>

    <button type="submit" [disabled]="!loginForm.valid" class="submit-btn">
      Login
    </button>

    <div *ngIf="errorMessage" class="error-message server-error">
      {{ errorMessage }}
    </div>
  </form>
</div>
