<div class="home-container">
  <div class="home-card">
    <h2 class="home-title">Welcome to the Asset Management System!</h2>
    <p class="home-text">You have successfully logged in and can now access all system features.</p>

    <div class="features-section">
      <h3 class="features-title">System Features:</h3>
      <ul class="features-list">
        <li>Manage Assets (Add, Edit, Delete)</li>
        <li>Track Asset Locations</li>
        <li>View Maintenance Schedules</li>
        <li>Generate Reports</li>
        <li>User Management</li>
      </ul>
    </div>

    <!-- Logout Button -->
    <button class="logout-button" (click)="logout()">
      Logout
    </button>
  </div>
</div>
