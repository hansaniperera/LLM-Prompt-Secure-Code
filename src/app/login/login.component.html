<!-- src/app/login/login.component.html -->
<div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md border border-gray-200">
  <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">Asset Management Login</h2>

  <form (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Username Field -->
    <div>
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        [(ngModel)]="username"
        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
        placeholder="Enter your username"
        required
      >
    </div>

    <!-- Password Field -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
        placeholder="Enter your password"
        required
      >
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="text-red-600 text-sm p-3 bg-red-50 rounded-md border border-red-200">
      {{ errorMessage }}
    </div>

    <!-- Submit Button -->
    <div>
      <button
        type="submit"
        [disabled]="loading"
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-lg font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out
               disabled:opacity-60 disabled:cursor-not-allowed"
      >
        <span *ngIf="!loading">Login</span>
        <svg *ngIf="loading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span *ngIf="loading">Logging in...</span>
      </button>
    </div>
  </form>
</div>
