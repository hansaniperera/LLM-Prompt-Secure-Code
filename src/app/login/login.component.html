<div class="login-container">
  <div class="login-card">
    <h2 class="login-title">Asset Management System Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" formControlName="username" placeholder="Enter your username">
        <!-- Display error message if username is invalid and touched -->
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="error-message">
          Username is required.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="Enter your password">
        <!-- Display error message if password is invalid and touched -->
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
          Password is required.
        </div>
      </div>

      <!-- Display general error message for login failures -->
      <div *ngIf="errorMessage" class="error-message api-error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="!loginForm.valid" class="login-button">
        Login
      </button>
    </form>
  </div>
</div>
